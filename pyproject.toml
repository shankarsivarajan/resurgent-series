[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resurgent-series"
version = "0.1.0"
description = "Resurgence and transseries analysis of tractable model systems: shared toolkit and per-paper reproduction scripts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shankar Sivarajan", email = "sivarajn@umich.edu" }]
dependencies = ["mpmath>=1.3", "numpy>=1.24", "python-flint>=0.6", "sympy>=1.12"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["resurgence*"]
